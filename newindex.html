<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tô com GUTO 22</title>

  <meta name="title" content="Tô com o Guto 22" />
  <meta name="description" content="Gere seu flyer personalizado com seu nome de apoio ao Guto." />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://lopesanders.github.io/agoraeguto22/" />
  <meta property="og:title" content="Tô com Guto" />
  <meta property="og:description" content="Gere seu flyer personalizado com seu nome de apoio ao Guto Volpi 22." />
  <meta property="og:image" itemprop="image" content="https://lopesanders.github.io/agoraeguto22/metadataBrasil.png?v=2" />

  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://lopesanders.github.io/agoraeguto22/" />
  <meta property="twitter:title" content="Tô com o Guto" />
  <meta property="twitter:description" content="Gere seu flyer personalizado com seu nome de apoio ao Guto Volpi 22." />
  <meta property="twitter:image" content="https://lopesanders.github.io/agoraeguto22/metadataBrasil.png?v=2" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles/style.css?v=4">

  <style>
    #image-editor {
      display: none;
      position: relative;
      width: 300px;
      height: 300px;
      border: 2px dashed #aaa;
      margin: 20px auto;
      overflow: hidden;
    }

    #image-editor img {
      position: absolute;
      top: 0;
      left: 0;
      cursor: move;
      max-width: none;
      transform-origin: top left;
    }
  </style>
</head>

<body>
  <noscript>
    <div>Para continuar habilite o JavaScript</div>
  </noscript>

  <div class="container">

    <section id="menu" class="menu-principal">
      <p class="label">Escolha uma opção:</p>
      <button onclick="clickNome()" class="btn btnFull">
        <img src="./apoioaobrasil.png" alt="Menu" />
        <div>
          <p>Coloque seu</p>
          <span class="menuBtnDestaque">Nome</span>
        </div>
      </button>
      <button onclick="clickFoto()" class="btn btnFull" style="margin-bottom: 25px;">
        <img src="./bannerInicialBrasil.png" alt="Menu" />
        <div>
          <p>Coloque sua</p>
          <span class="menuBtnDestaque">Foto</span>
        </div>
      </button>

      <div id="image-editor">
        <img id="uploaded-image" src="" alt="Preview" />
      </div>
      <input type="file" id="file-input" accept="image/*" />
      <button onclick="aplicarImagem()" class="btn">Aplicar imagem</button>

      <a class="btn btnFull btnCredito" href="https://www.instagram.com/andersonlopesdsgn/" target="_blank">
        <small>Construido por:
          <span>@andersonlopesdsgn</span></small>
      </a>
    </section>

    <main id="main" class="hidden">
      <div class="navbar">
        <button onclick="clickVoltar()" class="btn btnVoltar">← Menu </button>
        <a class="btn btnDoe" href="#" target="_blank">Faça seu tema</a>
      </div>

      <canvas width="1080" height="1080"></canvas>

      <div class="form-input">
        <input name="yourname" type="text" placeholder="Coloque seu nome aqui" />
        <div>
          <button id="btnSave" class="btn btnSave" href="javascript:saveImage()">Salvar</button>
          <button id="btnShare" class="btn btnShare" href="javascript:shareImage()">Compartilhar</button>
        </div>
      </div>

      <footer>
        <a href="https://www.instagram.com/andersonlopesdsgn/" target="_blank">
          <img src="img/instagram-logo.svg" />
          <span>Construido por @andersonlopesdsgn</span>
        </a>
      </footer>
    </main>
  </div>

  <script>
    const fileInput = document.getElementById('file-input');
    const image = document.getElementById('uploaded-image');
    const editor = document.getElementById('image-editor');

    let isDragging = false;
    let startX, startY, imgX = 0, imgY = 0, scale = 1;

    fileInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = event => {
          image.src = event.target.result;
          image.style.transform = `translate(0px, 0px) scale(1)`;
          editor.style.display = 'block';
          imgX = imgY = 0;
          scale = 1;
        };
        reader.readAsDataURL(file);
      }
    });

    image.addEventListener('mousedown', e => {
      isDragging = true;
      startX = e.clientX - imgX;
      startY = e.clientY - imgY;
    });

    window.addEventListener('mousemove', e => {
      if (isDragging) {
        imgX = e.clientX - startX;
        imgY = e.clientY - startY;
        image.style.transform = `translate(${imgX}px, ${imgY}px) scale(${scale})`;
      }
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    image.addEventListener('wheel', e => {
      e.preventDefault();
      scale += e.deltaY * -0.001;
      scale = Math.min(Math.max(0.2, scale), 3);
      image.style.transform = `translate(${imgX}px, ${imgY}px) scale(${scale})`;
    });

    function aplicarImagem() {
      alert('Imagem ajustada! Agora você pode usá-la no canvas como quiser.');
      // Aqui você pode integrar com o canvas ou outras lógicas do seu site.
    }
  </script>

  <script src="./scripts/script.js?v=4"></script>
</body>

</html>
